<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laam Wallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .portfolio-value {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .change {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .negative {
            color: #ff4d4d;
        }
        
        .positive {
            color: #4cd964;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 12px;
            padding: 15px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
        
        .action-btn i {
            font-size: 1.5rem;
        }
        
        .assets-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .asset {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .asset:last-child {
            border-bottom: none;
        }
        
        .asset-info {
            flex: 1;
        }
        
        .asset-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .asset-details {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .asset-amount {
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .laam-asset {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-top: 10px;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .action-buttons {
                grid-template-columns: 1fr;
            }
            
            .value {
                font-size: 2.5rem;
            }
        }
        
        .stellar-logo {
            color: #4fc3f7;
            font-size: 2.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-wallet stellar-logo"></i> Laam Wallet</h1>
            <p>Your Stellar wallet for XLM and Laam tokens</p>
        </header>
        
        <div class="card">
            <div class="portfolio-value">
                <div class="value">$6.65</div>
                <div class="change negative">
                    <i class="fas fa-arrow-down"></i>
                    <span>-$0.17 (2.58%)</span>
                </div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn">
                    <i class="fas fa-link"></i>
                    <span>Add Laam Trustline</span>
                </button>
                <button class="action-btn">
                    <i class="fas fa-lock"></i>
                    <span>Lock Wallet</span>
                </button>
            </div>
        </div>
        
        <div class="card">
            <div class="assets-section">
                <h2 class="section-title">My Assets</h2>
                
                <div class="asset">
                    <div class="asset-info">
                        <div class="asset-name">Lumens</div>
                        <div class="asset-details">XLM (stellar.org)</div>
                    </div>
                    <div class="asset-amount">16.9081 XLM</div>
                </div>
                
                <div class="asset">
                    <div class="asset-info">
                        <div class="asset-details">2.58% · $6.65</div>
                    </div>
                </div>
                
                <div class="asset laam-asset">
                    <div class="asset-info">
                        <div class="asset-name">Laam</div>
                    </div>
                    <div class="asset-amount">1,310,732.44 Laam</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>Laam Wallet © 2023 | Secure XLM and Laam Management</p>
    </footer>

    <script>
        // Simple animation for values
        document.addEventListener('DOMContentLoaded', function() {
            // Animate the portfolio value
            const valueElement = document.querySelector('.value');
            const originalValue = valueElement.textContent;
            valueElement.textContent = '$0.00';
            
            let value = 0;
            const targetValue = parseFloat(originalValue.replace('$', ''));
            const increment = targetValue / 100;
            
            const interval = setInterval(() => {
                value += increment;
                if (value >= targetValue) {
                    value = targetValue;
                    clearInterval(interval);
                }
                valueElement.textContent = '$' + value.toFixed(2);
            }, 20);
        });
    </script>
</body>
</html>
